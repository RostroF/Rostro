[package]
name = "rp-keystore"
version = "0.46.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Keystore primitives."
documentation = "https://docs.rs/rp-core"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
parking_lot = { optional = true, workspace = true }
rp-core = { workspace = true }
rp-externalities = { workspace = true }

[features]
default = ["std"]
std = ["codec/std", "dep:parking_lot", "rp-core/std", "rp-externalities/std"]

# This feature adds BLS crypto primitives.
# It should not be used in production since the implementation and interface may still
# be subject to significant changes.
bls-experimental = ["rp-core/bls-experimental"]

# This feature adds Bandersnatch crypto primitives.
# It should not be used in production since the implementation and interface may still
# be subject to significant changes.
bandersnatch-experimental = ["rp-core/bandersnatch-experimental"]

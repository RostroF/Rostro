[package]
name = "rp-transaction-storage-proof"
version = "41.0.0"
authors.workspace = true
description = "Transaction storage proof primitives"
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
async-trait = { optional = true, workspace = true }
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
rp-api = { workspace = true }
rp-core = { optional = true, workspace = true }
rp-inherents = { workspace = true }
rp-runtime = { workspace = true }
rp-trie = { optional = true, workspace = true }

[features]
default = ["std"]
std = [
	"async-trait",
	"codec/std",
	"scale-info/std",
	"rp-api/std",
	"rp-core/std",
	"rp-inherents/std",
	"rp-runtime/std",
	"rp-trie/std",
]

[package]
name = "rp-api"
version = "41.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Substrate runtime api primitives"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true }
docify = { workspace = true }
hash-db = { optional = true, workspace = true, default-features = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
rp-api-proc-macro = { workspace = true }
rp-core = { workspace = true }
rp-externalities = { optional = true, workspace = true }
rp-metadata-ir = { optional = true, workspace = true }
rp-runtime = { workspace = true }
rp-runtime-interface = { workspace = true }
rp-state-machine = { optional = true, workspace = true }
rp-trie = { optional = true, workspace = true }
rp-version = { workspace = true }
thiserror = { optional = true, workspace = true }

[dev-dependencies]
rp-test-primitives = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"hash-db",
	"log/std",
	"scale-info/std",
	"rp-api-proc-macro/std",
	"rp-core/std",
	"rp-externalities",
	"rp-externalities?/std",
	"rp-metadata-ir?/std",
	"rp-runtime-interface/std",
	"rp-runtime/std",
	"rp-state-machine/std",
	"rp-trie/std",
	"rp-version/std",
	"thiserror",
]
# Special feature to disable logging completely.
#
# By default `rp-api` initializes the `RuntimeLogger` for each runtime api function. However,
# logging functionality increases the code size. It is recommended to enable this feature when
# building a runtime for registering it on chain.
#
# This sets the max logging level to `off` for `log`.
disable-logging = ["log/max_level_off"]
# Do not report the documentation in the metadata.
no-metadata-docs = ["rp-api-proc-macro/no-metadata-docs"]
frame-metadata = ["rp-metadata-ir"]

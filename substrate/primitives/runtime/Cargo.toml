[package]
name = "rp-runtime"
version = "46.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Runtime Modules shared primitive types."
documentation = "https://docs.rs/rp-runtime"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
binary-merkle-tree = { workspace = true }
bytes = { workspace = true }
codec = { features = ["derive", "max-encoded-len"], workspace = true }
docify = { workspace = true }
either = { workspace = true }
hash256-std-hasher = { workspace = true }
impl-trait-for-tuples = { workspace = true }
log = { workspace = true }
num-traits = { workspace = true }
paste = { workspace = true, default-features = true }
rand = { optional = true, workspace = true, default-features = true }
scale-info = { features = ["derive"], workspace = true }
serde = { features = ["alloc", "derive"], optional = true, workspace = true }
rp-application-crypto = { workspace = true }
rp-arithmetic = { workspace = true }
rp-core = { workspace = true }
rp-io = { workspace = true }
rp-std = { workspace = true }
rp-trie = { workspace = true }
rp-weights = { workspace = true }
strum = { workspace = true, features = ["derive"] }
tracing = { workspace = true, features = ["log"], default-features = false }

simple-mermaid = { workspace = true, optional = true }
tuplex = { workspace = true, default-features = false }

[dev-dependencies]
rand = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
rp-api = { default-features = true, workspace = true }
rp-keystore = { default-features = true, workspace = true }
rp-state-machine = { default-features = true, workspace = true }
rp-tracing = { default-features = true, workspace = true }
substrate-test-runtime-client = { workspace = true }
zstd = { workspace = true }

[features]
runtime-benchmarks = []
try-runtime = []
default = ["std"]
std = [
	"binary-merkle-tree/std",
	"bytes/std",
	"codec/std",
	"either/std",
	"either/use_std",
	"hash256-std-hasher/std",
	"log/std",
	"num-traits/std",
	"rand",
	"scale-info/std",
	"serde/std",
	"simple-mermaid",
	"rp-application-crypto/std",
	"rp-arithmetic/std",
	"rp-core/std",
	"rp-io/std",
	"rp-std/std",
	"rp-trie/std",
	"rp-weights/std",
	"strum/std",
	"tracing/std",
	"tuplex/std",
]

# Serde support without relying on std features.
serde = [
	"dep:serde",
	"scale-info/serde",
	"rp-application-crypto/serde",
	"rp-arithmetic/serde",
	"rp-core/serde",
	"rp-weights/serde",
]

# This feature adds BLS crypto primitives.
# It should not be used in production since the implementation and interface may still
# be subject to significant changes.
bls-experimental = [
	"rp-application-crypto/bls-experimental",
	"rp-core/bls-experimental",
	"rp-io/bls-experimental",
]

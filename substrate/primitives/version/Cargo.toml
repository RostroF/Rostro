[package]
name = "rp-version"
version = "44.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Version module for the Substrate runtime; Provides a function that returns the runtime version."
documentation = "https://docs.rs/rp-version"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
impl-serde = { optional = true, workspace = true }
parity-wasm = { optional = true, workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { features = ["alloc", "derive"], optional = true, workspace = true }
rp-core = { workspace = true }
rp-crypto-hashing-proc-macro = { default-features = true, workspace = true }
rp-runtime = { workspace = true }
rp-std = { workspace = true }
rp-version-proc-macro = { workspace = true }
thiserror = { optional = true, workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"impl-serde/std",
	"parity-wasm",
	"scale-info/std",
	"serde/std",
	"rp-core/std",
	"rp-runtime/std",
	"rp-std/std",
	"thiserror",
]

# Serde support without relying on std features.
serde = ["dep:serde", "impl-serde", "rp-runtime/serde"]

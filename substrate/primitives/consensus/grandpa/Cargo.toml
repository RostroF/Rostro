[package]
name = "rp-consensus-grandpa"
version = "28.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Primitives for GRANDPA integration, suitable for WASM compilation."
documentation = "https://docs.rs/rp-consensus-grandpa"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
finality-grandpa = { features = ["derive-codec"], workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { features = ["alloc", "derive"], optional = true, workspace = true }
rp-api = { workspace = true }
rp-application-crypto = { workspace = true }
rp-core = { workspace = true }
rp-keystore = { optional = true, workspace = true }
rp-runtime = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"finality-grandpa/std",
	"log/std",
	"scale-info/std",
	"serde/std",
	"rp-api/std",
	"rp-application-crypto/std",
	"rp-core/std",
	"rp-keystore/std",
	"rp-runtime/std",
]

# Serde support without relying on std features.
serde = [
	"dep:serde",
	"scale-info/serde",
	"rp-application-crypto/serde",
	"rp-core/serde",
	"rp-runtime/serde",
]

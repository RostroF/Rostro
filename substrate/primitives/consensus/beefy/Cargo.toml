[package]
name = "rp-consensus-beefy"
version = "29.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Primitives for BEEFY protocol."

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { optional = true, features = ["alloc", "derive"], workspace = true }
rp-api = { workspace = true }
rp-application-crypto = { workspace = true }
rp-core = { workspace = true }
rp-crypto-hashing = { workspace = true }
rp-io = { workspace = true }
rp-keystore = { workspace = true }
rp-mmr-primitives = { workspace = true }
rp-runtime = { workspace = true }
rp-weights = { workspace = true }
strum = { features = ["derive"], workspace = true }

[dev-dependencies]
array-bytes = { workspace = true, default-features = true }
w3f-bls = { features = ["std"], workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"scale-info/std",
	"serde/std",
	"rp-api/std",
	"rp-application-crypto/std",
	"rp-core/std",
	"rp-crypto-hashing/std",
	"rp-io/std",
	"rp-keystore/std",
	"rp-mmr-primitives/std",
	"rp-runtime/std",
	"rp-weights/std",
	"strum/std",
]

# Serde support without relying on std features.
serde = [
	"dep:serde",
	"scale-info/serde",
	"rp-application-crypto/serde",
	"rp-core/serde",
	"rp-runtime/serde",
]

# This feature adds BLS crypto primitives. It should not be used in production since
# the BLS implementation and interface may still be subject to significant change.
bls-experimental = [
	"rp-application-crypto/bls-experimental",
	"rp-core/bls-experimental",
]

[package]
name = "rp-consensus-aura"
version = "0.47.0"
authors.workspace = true
description = "Primitives for Aura consensus"
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
async-trait = { optional = true, workspace = true }
codec = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
rp-api = { workspace = true }
rp-application-crypto = { workspace = true }
rp-consensus-slots = { workspace = true }
rp-inherents = { workspace = true }
rp-runtime = { workspace = true }
rp-timestamp = { workspace = true }

[features]
default = ["std"]
std = [
	"async-trait",
	"codec/std",
	"scale-info/std",
	"rp-api/std",
	"rp-application-crypto/std",
	"rp-consensus-slots/std",
	"rp-inherents/std",
	"rp-runtime/std",
	"rp-timestamp/std",
]

# Serde support without relying on std features.
serde = [
	"scale-info/serde",
	"rp-application-crypto/serde",
	"rp-consensus-slots/serde",
	"rp-runtime/serde",
]

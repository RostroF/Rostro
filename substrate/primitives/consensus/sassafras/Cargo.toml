[package]
name = "rp-consensus-sassafras"
version = "0.3.4"
authors.workspace = true
description = "Primitives for Sassafras consensus"
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/rp-consensus-sassafras"
readme = "README.md"
publish = false

[package.metadata.polkadot-sdk]
exclude-from-umbrella = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { features = ["derive"], optional = true, workspace = true }
rp-api = { workspace = true }
rp-application-crypto = { features = ["bandersnatch-experimental"], workspace = true }
rp-consensus-slots = { workspace = true }
rp-core = { features = ["bandersnatch-experimental"], workspace = true }
rp-runtime = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"scale-info/std",
	"serde/std",
	"rp-api/std",
	"rp-application-crypto/std",
	"rp-consensus-slots/std",
	"rp-core/std",
	"rp-runtime/std",
]

# Serde support without relying on std features.
serde = [
	"dep:serde",
	"scale-info/serde",
	"rp-application-crypto/serde",
	"rp-consensus-slots/serde",
	"rp-core/serde",
	"rp-runtime/serde",
]

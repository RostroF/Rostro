[package]
name = "rp-session"
version = "43.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Primitives for sessions"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
rp-api = { workspace = true }
rp-core = { workspace = true }
rp-keystore = { optional = true, workspace = true }
rp-runtime = { workspace = true }
rp-staking = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"scale-info/std",
	"rp-api/std",
	"rp-core/std",
	"rp-keystore/std",
	"rp-runtime/std",
	"rp-staking/std",
]

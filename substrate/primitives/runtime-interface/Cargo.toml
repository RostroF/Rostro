[package]
name = "rp-runtime-interface"
version = "34.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Substrate runtime interface"
documentation = "https://docs.rs/rp-runtime-interface/"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
bytes = { workspace = true }
codec = { features = ["bytes"], workspace = true }
impl-trait-for-tuples = { workspace = true }
rp-externalities = { workspace = true }
rp-runtime-interface-proc-macro = { default-features = true, workspace = true }
rp-std = { workspace = true }
rp-storage = { workspace = true }
rp-tracing = { workspace = true }
rp-wasm-interface = { workspace = true }
static_assertions = { workspace = true, default-features = true }

[target.'cfg(all(target_arch = "riscv64", substrate_runtime))'.dependencies]
polkavm-derive = { workspace = true }

[dev-dependencies]
rustversion = { workspace = true }
rp-io = { default-features = true, workspace = true }
rp-runtime-interface-test-wasm = { workspace = true }
rp-state-machine = { default-features = true, workspace = true }
trybuild = { workspace = true }

[features]
default = ["std"]
std = [
	"bytes/std",
	"codec/std",
	"rp-externalities/std",
	"rp-std/std",
	"rp-storage/std",
	"rp-tracing/std",
	"rp-wasm-interface/std",
]

# ATTENTION
#
# Only use when you know what you are doing.
#
# Disables static assertions in `impls.rs` that checks the word size. To prevent any footgun, the
# check is changed into a runtime check.
disable_target_static_assertions = []

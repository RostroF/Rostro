[package]
name = "rp-keyring"
version = "46.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Keyring support code for the runtime. A set of test accounts."
documentation = "https://docs.rs/rp-keyring"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
rp-core = { workspace = true }
rp-runtime = { workspace = true }
strum = { features = ["derive"], workspace = true }

[features]
default = ["std"]
std = ["rp-core/std", "rp-runtime/std", "strum/std"]

# This feature adds Bandersnatch crypto primitives.
# It should not be used in production since the implementation and interface may still
# be subject to significant changes.
bandersnatch-experimental = ["rp-core/bandersnatch-experimental"]

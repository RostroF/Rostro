[package]
name = "rp-authority-discovery"
version = "41.0.0"
authors.workspace = true
description = "Authority discovery primitives"
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
rp-api = { workspace = true }
rp-application-crypto = { workspace = true }
rp-runtime = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"scale-info/std",
	"rp-api/std",
	"rp-application-crypto/std",
	"rp-runtime/std",
]
serde = [
	"scale-info/serde",
	"rp-application-crypto/serde",
	"rp-runtime/serde",
]

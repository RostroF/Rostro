[package]
name = "substrate-test-runtime"
version = "2.0.0"
authors.workspace = true
edition.workspace = true
build = "build.rs"
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
frame-executive = { workspace = true }
frame-metadata-hash-extension = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-system-rpc-runtime-api = { workspace = true }
pallet-babe = { workspace = true }
pallet-balances = { workspace = true }
pallet-session = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-utility = { workspace = true }
rc-service = { optional = true, workspace = true }
scale-info = { features = ["derive"], workspace = true }
rp-api = { workspace = true }
rp-application-crypto = { features = ["serde"], workspace = true }
rp-block-builder = { workspace = true }
rp-consensus-aura = { features = ["serde"], workspace = true }
rp-consensus-babe = { features = ["serde"], workspace = true }
rp-consensus-grandpa = { features = ["serde"], workspace = true }
rp-core = { features = ["serde"], workspace = true }
rp-crypto-hashing = { workspace = true }
rp-debug-derive = { default-features = false, workspace = true }
rp-externalities = { workspace = true }
rp-genesis-builder = { workspace = true }
rp-inherents = { workspace = true }
rp-io = { workspace = true }
rp-keyring = { workspace = true }
rp-offchain = { workspace = true }
rp-runtime = { features = ["serde"], workspace = true }
rp-session = { workspace = true }
rp-state-machine = { workspace = true }
rp-statement-store = { workspace = true }
rp-transaction-pool = { workspace = true }
rp-trie = { workspace = true }
rp-version = { workspace = true }
trie-db = { workspace = true }

# 3rd party
array-bytes = { optional = true, workspace = true, default-features = true }
log = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
tracing = { workspace = true, default-features = false }

[dev-dependencies]
futures = { workspace = true }
pretty_assertions = { workspace = true }
rc-block-builder = { default-features = true, workspace = true }
rc-chain-spec = { default-features = true, workspace = true }
rc-executor = { default-features = true, workspace = true }
rc-executor-common = { default-features = true, workspace = true }
serde = { features = ["alloc", "derive"], workspace = true }
rp-consensus = { default-features = true, workspace = true }
rp-tracing = { default-features = true, workspace = true }
substrate-test-runtime-client = { workspace = true }

[build-dependencies]
substrate-wasm-builder = { optional = true, features = ["metadata-hash"], workspace = true, default-features = true }

[features]
default = ["std"]

std = [
	"array-bytes",
	"codec/std",
	"frame-executive/std",
	"frame-metadata-hash-extension/std",
	"frame-support/std",
	"frame-system-rpc-runtime-api/std",
	"frame-system/std",
	"log/std",
	"pallet-babe/std",
	"pallet-balances/std",
	"pallet-session/std",
	"pallet-timestamp/std",
	"pallet-utility/std",
	"rc-service",
	"scale-info/std",
	"serde/std",
	"serde_json/std",
	"rp-api/std",
	"rp-application-crypto/std",
	"rp-block-builder/std",
	"rp-consensus-aura/std",
	"rp-consensus-babe/std",
	"rp-consensus-grandpa/std",
	"rp-core/std",
	"rp-crypto-hashing/std",
	"rp-debug-derive/std",
	"rp-externalities/std",
	"rp-genesis-builder/std",
	"rp-inherents/std",
	"rp-io/std",
	"rp-keyring/std",
	"rp-offchain/std",
	"rp-runtime/std",
	"rp-session/std",
	"rp-state-machine/std",
	"rp-statement-store/std",
	"rp-transaction-pool/std",
	"rp-trie/std",
	"rp-version/std",
	"substrate-wasm-builder",
	"tracing/std",
	"trie-db/std",
]

# Special feature to disable logging
disable-logging = ["rp-api/disable-logging"]

# This feature adds BLS crypto primitives.
# It should not be used in production since the implementation and interface may still
# be subject to significant changes.
bls-experimental = ["rp-application-crypto/bls-experimental"]

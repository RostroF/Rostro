[package]
name = "pallet-rns-resolvers"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Rostro Name Service (RNS) resolver pallet — DNS record management for registered names. Originally authored as PNS by Anthony Czarnik; vendored into Rostro 2026-05-03."
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { features = ["derive"], workspace = true, default-features = false }

frame-benchmarking = { optional = true, workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }

sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
sp-weights = { workspace = true }

rns-types = { workspace = true }
pallet-rns-registrar = { workspace = true, optional = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-rns-registrar?/std",
	"rns-types/std",
	"sp-core/std",
	"sp-runtime/std",
	"sp-std/std",
	"sp-weights/std",
	"scale-info/std",
	"serde/std",
]
runtime-benchmarks = [
	"dep:pallet-rns-registrar",
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-rns-registrar/runtime-benchmarks",
	"rns-types/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-rns-registrar?/try-runtime",
	"rns-types/try-runtime",
	"sp-runtime/try-runtime",
]

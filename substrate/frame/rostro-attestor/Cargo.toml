[package]
name = "pallet-rostro-attestor"
description = "Attestor Quorum: a subset of validators signs the RootOfRoots checkpoint with secp256k1, landed as unsigned txs (mempool-aggregated), so a foreign Ethereum contract verifies it via ecrecover. Runtime half."
version = "0.1.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-application-crypto = { features = ["serde"], workspace = true }
sp-core = { features = ["serde"], workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }

[dev-dependencies]
sp-core = { workspace = true, default-features = true }
sp-io = { workspace = true, default-features = true }
sp-keystore = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "sp-application-crypto/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
]

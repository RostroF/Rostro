[package]
authors.workspace = true
edition.workspace = true
name = "pallet-message-queue"
version = "49.0.0"
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "FRAME pallet to queue and process messages"

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
environmental = { workspace = true }
frame-benchmarking = { optional = true, workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { optional = true, features = ["derive"], workspace = true, default-features = true }
rp-arithmetic = { workspace = true }
rp-core = { workspace = true }
rp-io = { workspace = true }
rp-runtime = { workspace = true }
rp-weights = { workspace = true }

[dev-dependencies]
frame-support = { features = ["experimental"], workspace = true, default-features = false }
rand = { workspace = true, default-features = true }
rand_distr = { workspace = true }
rp-crypto-hashing = { default-features = true, workspace = true }
rp-tracing = { default-features = true, workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"environmental/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"scale-info/std",
	"rp-arithmetic/std",
	"rp-core/std",
	"rp-io/std",
	"rp-runtime/std",
	"rp-weights/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"rp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"rp-runtime/try-runtime",
]

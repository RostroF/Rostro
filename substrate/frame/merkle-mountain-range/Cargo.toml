[package]
name = "pallet-mmr"
version = "46.0.1"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "FRAME Merkle Mountain Range pallet."

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
rp-arithmetic = { workspace = true }
rp-core = { workspace = true }
rp-io = { workspace = true }
rp-mmr-primitives = { workspace = true }
rp-runtime = { workspace = true }

[dev-dependencies]
itertools = { workspace = true }
rp-core = { workspace = true, default-features = true }
rp-io = { workspace = true, default-features = true }
rp-tracing = { default-features = true, workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"scale-info/std",
	"rp-arithmetic/std",
	"rp-core/std",
	"rp-io/std",
	"rp-mmr-primitives/std",
	"rp-runtime/std",
]
runtime-benchmarks = [
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"rp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"rp-runtime/try-runtime",
]

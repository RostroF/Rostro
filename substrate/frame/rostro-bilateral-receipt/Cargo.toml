[package]
name = "pallet-rostro-bilateral-receipt"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Bilateral non-repudiation receipts for Rostro economic interactions. Customer and operator both sign one SCALE-encoded payload; the pallet verifies both signatures, performs the balance transfer atomically, optionally triggers an operator-state mint via the configured AtomicMintHook, and records the receipt by hash. Anyone can relay a signed pair to chain — submitter doesn't have to be either party — which means light clients can hand off settlement without the operator running a full node, and customers can pre-sign before a trade and have the operator finalize it on submission. Sponsorship voucher (pattern C: customer-signed action with operator-paid fees) lives at the runtime fee-payment layer, not in this pallet — but the FeePayerKind field on the receipt records who paid for downstream auditing."
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }

frame-benchmarking = { optional = true, workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }

sp-core = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }

[dev-dependencies]
pallet-balances = { workspace = true, default-features = true }
sp-keyring = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"pallet-balances/std",
	"scale-info/std",
	"sp-core/std",
	"sp-io/std",
	"sp-runtime/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-balances/try-runtime",
	"sp-runtime/try-runtime",
]

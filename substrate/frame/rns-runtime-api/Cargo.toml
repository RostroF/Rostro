[package]
name = "rns-runtime-api"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Runtime API definitions for the Rostro Name Service (RNS). Originally authored as PNS by Anthony Czarnik; vendored into Rostro 2026-05-03."
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { features = ["derive"], workspace = true, default-features = false }

rp-api = { workspace = true }
rp-core = { workspace = true }
rp-runtime = { workspace = true }
rp-std = { workspace = true }

rns-types = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"rns-types/std",
	"rp-api/std",
	"rp-core/std",
	"rp-runtime/std",
	"rp-std/std",
	"scale-info/std",
	"serde/std",
]
runtime-benchmarks = [
	"rns-types/runtime-benchmarks",
]
try-runtime = [
	"rns-types/try-runtime",
]

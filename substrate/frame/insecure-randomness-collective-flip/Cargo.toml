[package]
name = "pallet-insecure-randomness-collective-flip"
version = "34.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Insecure do not use in production: FRAME randomness collective flip pallet"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
safe-mix = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
rp-core = { workspace = true }
rp-runtime = { workspace = true }

[dev-dependencies]
rp-io = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-support/std",
	"frame-system/std",
	"safe-mix/std",
	"scale-info/std",
	"rp-core/std",
	"rp-runtime/std",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"rp-runtime/try-runtime",
]

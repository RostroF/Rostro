[package]
name = "pallet-authority-discovery"
version = "46.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "FRAME pallet for authority discovery"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-session = { features = ["historical"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
rp-application-crypto = { workspace = true }
rp-authority-discovery = { workspace = true }
rp-runtime = { workspace = true }

[dev-dependencies]
pallet-balances = { workspace = true, default-features = false }
rp-core = { default-features = true, workspace = true }
rp-io = { default-features = true, workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-balances/std",
	"pallet-session/std",
	"scale-info/std",
	"rp-application-crypto/std",
	"rp-authority-discovery/std",
	"rp-runtime/std",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-session/try-runtime",
	"rp-runtime/try-runtime",
]

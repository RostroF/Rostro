[package]
name = "pallet-rostro-key-lineage"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Permanent consensus-key lineage for the GRANDPA juror credential. Records (validator, grandpa_key, era_range) forever, enforces the fresh-key primitive (a key is accepted by set_keys exactly once in chain history), and enforces the forced-rotation deadline (a key older than K eras excludes its validator from the next authority set, hard cutover, re-entry on fresh key registration). The on-chain organ that makes forced rotation, the retired-key canary offence, and cross-set equivocation proofs possible. docs/CONSENSUS-KEY-LIFECYCLE.md workstream 1."
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }

frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-session = { features = ["historical"], workspace = true }

sp-api = { workspace = true }
sp-consensus-grandpa = { workspace = true }
sp-runtime = { workspace = true }
sp-staking = { workspace = true }

[dev-dependencies]
pallet-balances = { workspace = true, features = ["std"] }
pallet-offences = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }
sp-state-machine = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"pallet-session/std",
	"scale-info/std",
	"sp-api/std",
	"sp-consensus-grandpa/std",
	"sp-runtime/std",
	"sp-staking/std",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-session/try-runtime",
	"sp-runtime/try-runtime",
]

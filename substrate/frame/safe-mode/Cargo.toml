[package]
name = "pallet-safe-mode"
version = "27.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "FRAME safe-mode pallet"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
docify = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-balances = { optional = true, workspace = true }
pallet-proxy = { optional = true, workspace = true }
pallet-utility = { optional = true, workspace = true }
scale-info = { features = ["derive"], workspace = true }
rp-arithmetic = { workspace = true }
rp-runtime = { workspace = true }

[dev-dependencies]
pallet-balances = { default-features = true, workspace = true }
pallet-proxy = { default-features = true, workspace = true }
pallet-utility = { default-features = true, workspace = true }
rp-core = { workspace = true, default-features = true }
rp-io = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-balances?/std",
	"pallet-proxy?/std",
	"pallet-utility?/std",
	"scale-info/std",
	"rp-arithmetic/std",
	"rp-runtime/std",
]
runtime-benchmarks = [
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-proxy/runtime-benchmarks",
	"pallet-utility/runtime-benchmarks",
	"rp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-balances?/try-runtime",
	"pallet-proxy?/try-runtime",
	"pallet-utility?/try-runtime",
	"rp-runtime/try-runtime",
]

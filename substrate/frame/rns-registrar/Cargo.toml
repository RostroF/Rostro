[package]
name = "pallet-rns-registrar"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Rostro Name Service (RNS) registrar pallet — domain registration, renewal, transfer, subdomain delegation, NFT-backed ownership, registry, origin tracking, price oracle. Originally authored as PNS by Anthony Czarnik; vendored into Rostro 2026-05-03."
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { features = ["derive"], workspace = true, default-features = false }

frame-benchmarking = { optional = true, workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }

rp-core = { workspace = true }
rp-io = { workspace = true }
rp-runtime = { workspace = true }
rp-std = { workspace = true }
rp-weights = { workspace = true }

pallet-timestamp = { workspace = true }

rns-types = { workspace = true }

[dev-dependencies]
pallet-rns-resolvers = { workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"pallet-timestamp/std",
	"rns-types/std",
	"rp-core/std",
	"rp-io/std",
	"rp-runtime/std",
	"rp-std/std",
	"rp-weights/std",
	"scale-info/std",
	"serde/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-timestamp/runtime-benchmarks",
	"rns-types/runtime-benchmarks",
	"rp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-timestamp/try-runtime",
	"rns-types/try-runtime",
	"rp-runtime/try-runtime",
]

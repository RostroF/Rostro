[package]
name = "pallet-paged-list"
version = "0.24.0"
description = "FRAME pallet that provides a paged list data structure."
authors.workspace = true
homepage.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
docify = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
rp-io = { workspace = true }
rp-metadata-ir = { optional = true, workspace = true }
rp-runtime = { workspace = true }

[dev-dependencies]
rp-io = { workspace = true, default-features = true }

[features]
default = ["std"]

std = [
	"codec/std",
	"frame-support/std",
	"frame-system/std",
	"scale-info/std",
	"rp-io/std",
	"rp-metadata-ir/std",
	"rp-runtime/std",
]

runtime-benchmarks = [
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"rp-runtime/runtime-benchmarks",
]

try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"rp-runtime/try-runtime",
]

frame-metadata = ["rp-metadata-ir"]

[package]
description = "FRAME's mixnet pallet"
name = "pallet-mixnet"
version = "0.22.0"
license = "Apache-2.0"
authors = ["Parity Technologies <admin@parity.io>"]
edition.workspace = true
homepage.workspace = true
repository = "https://github.com/paritytech/substrate/"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde = { features = ["derive"], workspace = true }
rp-application-crypto = { workspace = true }
rp-arithmetic = { workspace = true }
rp-io = { workspace = true }
rp-mixnet = { workspace = true }
rp-runtime = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"scale-info/std",
	"serde/std",
	"rp-application-crypto/std",
	"rp-arithmetic/std",
	"rp-io/std",
	"rp-mixnet/std",
	"rp-runtime/std",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"rp-runtime/try-runtime",
]

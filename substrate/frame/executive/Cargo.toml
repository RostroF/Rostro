[package]
name = "frame-executive"
version = "46.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "FRAME executives engine"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
aquamarine = { workspace = true }
codec = { features = ["derive"], workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-try-runtime = { optional = true, workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
rp-core = { workspace = true }
rp-io = { workspace = true }
rp-runtime = { workspace = true }
rp-tracing = { workspace = true }

[dev-dependencies]
array-bytes = { workspace = true, default-features = true }
pallet-balances = { default-features = true, workspace = true }
pallet-transaction-payment = { default-features = true, workspace = true }
rp-core = { default-features = true, workspace = true }
rp-inherents = { default-features = true, workspace = true }
rp-io = { default-features = true, workspace = true }
rp-version = { default-features = true, workspace = true }
substrate-test-runtime-client = { workspace = true }

[features]
default = ["std"]
with-tracing = ["rp-tracing/with-tracing"]
std = [
	"codec/std",
	"frame-support/experimental",
	"frame-support/std",
	"frame-system/std",
	"frame-try-runtime/std",
	"log/std",
	"scale-info/std",
	"rp-core/std",
	"rp-io/std",
	"rp-runtime/std",
	"rp-tracing/std",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"frame-try-runtime/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-transaction-payment/try-runtime",
	"rp-runtime/try-runtime",
]

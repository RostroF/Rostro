[package]
name = "rostro-runtime"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Rostro solochain runtime — Phase 1 (dev). Aura + GRANDPA, RNS family, proof-verifier scaffold."
publish = false
build = "build.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }

# FRAME
frame-benchmarking = { optional = true, workspace = true }
frame-executive = { workspace = true }
frame-metadata-hash-extension = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-system-benchmarking = { optional = true, workspace = true }
frame-system-rpc-runtime-api = { workspace = true }
frame-try-runtime = { optional = true, workspace = true }

# System / consensus / utility pallets
pallet-aura = { workspace = true }
pallet-authorship = { workspace = true }
pallet-balances = { workspace = true }
pallet-grandpa = { workspace = true }
pallet-multisig = { workspace = true }
pallet-proxy = { workspace = true }
# Sassafras lives in the runtime tree as a *dormant* dependency at R1: types
# are available so node-side and chainspec code can name them, but the pallet
# is NOT yet wired into `construct_runtime!`. Its `on_initialize` hard-expects
# a `SASS` pre-runtime digest on every block, which Aura blocks don't carry —
# wiring it live before the Sassafras-aware slot worker exists would brick
# the chain. The full integration (construct_runtime entry, Config impl,
# SassafrasApi runtime API) lands in Phase Ring R3 alongside the chainspec
# switch + `rc-consensus-sassafras` worker.
pallet-sassafras = { workspace = true }
pallet-session = { workspace = true }
pallet-sudo = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }
pallet-utility = { workspace = true }

# Rostro pallets
pallet-proof-verifier = { workspace = true }
pallet-rns-marketplace = { workspace = true }
pallet-rns-registrar = { workspace = true }
pallet-rns-resolvers = { workspace = true }
pallet-rostro-proof-anchor = { workspace = true }
pallet-rostro-type-registry = { workspace = true }
rns-runtime-api = { workspace = true }
rns-types = { workspace = true }

# Primitives
# `improved_panic_error_reporting` routes runtime panics through
# `panic_handler::abort_on_panic` (a normal host fn) instead of the
# log+unreachable() path; that's the only way `rostro-executor`'s trap
# handler can surface a panic message back to the chain spec. Without
# this feature, panics from genesis-state construction become opaque
# `guest trap` errors.
sp-io = { workspace = true, features = ["improved_panic_error_reporting"] }
# Phase Star B7: declare a 512 KiB minimum stack via
# `polkavm_derive::min_stack_size!`. Polkavm-linker's default is
# `VM_MIN_PAGE_SIZE * 2` = 8 KiB, which is enough for tiny PVM
# guests but blows the stack inside serde_json's typed deserialiser
# for the full `RuntimeGenesisConfig` struct. 512 KiB matches what
# the rostro-vm-bench dilithium services use as a known-good ceiling.
polkavm-derive = { workspace = true }
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-debug-derive = { workspace = true }
sp-consensus-aura = { features = ["serde"], workspace = true }
sp-consensus-grandpa = { features = ["serde"], workspace = true }
sp-consensus-sassafras = { features = ["serde"], workspace = true }
sp-core = { features = ["serde"], workspace = true }
sp-genesis-builder = { workspace = true }
sp-inherents = { workspace = true }
sp-offchain = { workspace = true }
sp-runtime = { features = ["serde"], workspace = true }
sp-session = { workspace = true }
sp-std = { workspace = true }
sp-storage = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-version = { workspace = true }

[build-dependencies]
substrate-wasm-builder = { optional = true, workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-executive/std",
	"frame-metadata-hash-extension/std",
	"frame-support/std",
	"frame-system-benchmarking?/std",
	"frame-system-rpc-runtime-api/std",
	"frame-system/std",
	"frame-try-runtime?/std",
	"log/std",
	"sp-io/std",
	"pallet-aura/std",
	"pallet-authorship/std",
	"pallet-balances/std",
	"pallet-grandpa/std",
	"pallet-multisig/std",
	"pallet-proof-verifier/std",
	"pallet-proxy/std",
	"pallet-rns-marketplace/std",
	"pallet-rns-registrar/std",
	"pallet-rns-resolvers/std",
	"pallet-rostro-proof-anchor/std",
	"pallet-rostro-type-registry/std",
	"rns-runtime-api/std",
	"rns-types/std",
	"pallet-sassafras/std",
	"pallet-session/std",
	"pallet-sudo/std",
	"pallet-timestamp/std",
	"pallet-transaction-payment-rpc-runtime-api/std",
	"pallet-transaction-payment/std",
	"pallet-utility/std",
	"sp-api/std",
	"sp-block-builder/std",
	"sp-debug-derive/std",
	"sp-consensus-aura/std",
	"sp-consensus-grandpa/std",
	"sp-consensus-sassafras/std",
	"sp-core/std",
	"sp-genesis-builder/std",
	"sp-inherents/std",
	"sp-offchain/std",
	"sp-runtime/std",
	"sp-session/std",
	"sp-std/std",
	"sp-storage/std",
	"sp-transaction-pool/std",
	"sp-version/std",
	"scale-info/std",
	"serde_json/std",
	"substrate-wasm-builder",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system-benchmarking/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-grandpa/runtime-benchmarks",
	"pallet-multisig/runtime-benchmarks",
	"pallet-proof-verifier/runtime-benchmarks",
	"pallet-proxy/runtime-benchmarks",
	"pallet-sudo/runtime-benchmarks",
	"pallet-timestamp/runtime-benchmarks",
	"pallet-transaction-payment/runtime-benchmarks",
	"pallet-utility/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-executive/try-runtime",
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"frame-try-runtime/try-runtime",
	"pallet-aura/try-runtime",
	"pallet-authorship/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-grandpa/try-runtime",
	"pallet-multisig/try-runtime",
	"pallet-proxy/try-runtime",
	"pallet-sudo/try-runtime",
	"pallet-timestamp/try-runtime",
	"pallet-transaction-payment/try-runtime",
	"pallet-utility/try-runtime",
	"sp-runtime/try-runtime",
]

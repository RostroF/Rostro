[package]
name = "gemini-runtime"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Gemini: Sassafras-flavoured Rostro testbed runtime. Phase Ring R3.2/R3.3. Sassafras + GRANDPA + minimal pallets only — RNS / proof-anchor / etc. land in follow-ups once consensus is proven on twin-node bringup."
publish = false
build = "build.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }

# FRAME
frame-executive = { workspace = true }
frame-metadata-hash-extension = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-system-rpc-runtime-api = { workspace = true }

# Consensus + system pallets (minimal set)
pallet-authorship = { workspace = true }
pallet-balances = { workspace = true }
pallet-grandpa = { workspace = true }
pallet-rns-marketplace = { workspace = true }
pallet-rns-registrar = { workspace = true }
pallet-rns-resolvers = { workspace = true }
rns-runtime-api = { workspace = true }
pallet-rostro-bilateral-receipt = { workspace = true }
pallet-rostro-canonical-files = { workspace = true }
pallet-rostro-operator-state = { workspace = true }
pallet-rostro-personhood = { workspace = true }
pallet-rostro-rpc-method-policy = { workspace = true }
rns-types = { workspace = true }
rostro-multi-key = { path = "../../utils/rostro-multi-key", default-features = false }
pallet-sassafras = { workspace = true, features = ["construct-dummy-ring-context"] }
pallet-session = { workspace = true }
pallet-sudo = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }

# zk-pki — production hardware-attestation primitive. Vendored
# from ~/Polkadot/pki/ on 2026-05-08. The `test-utils` feature on
# zk-pki-tpm exposes `NoopBindingProofVerifier`, the same dev-mode
# binding verifier paseo uses pre-`DOTWAVE_SIGNING_CERT_HASH`. The
# production `ProductionBindingProofVerifier` swap happens once
# dotwave's signing cert is final.
zk-pki-pallet = { workspace = true }
zk-pki-primitives = { workspace = true }
zk-pki-tpm = { workspace = true, features = ["test-utils"] }

# Primitives
# Phase Star B8: route runtime panics through panic_handler::abort_on_panic
# (capturable as a host fn) so `rostro-executor`'s trap handler can
# surface a message. Mirrors the rostro-runtime feature toggle landed in B7.
sp-io = { workspace = true, features = ["improved_panic_error_reporting"] }
# Phase Star B8: declare 512 KiB minimum stack so serde_json's typed
# deserialiser for the gemini RuntimeGenesisConfig has headroom (the
# polkavm-linker default is 8 KiB). Same rationale as the rostro-runtime
# declaration landed in B7.
polkavm-derive = { workspace = true }
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-consensus-grandpa = { features = ["serde"], workspace = true }
sp-consensus-sassafras = { features = ["serde"], workspace = true }
sp-core = { features = ["serde"], workspace = true }
sp-genesis-builder = { workspace = true }
sp-inherents = { workspace = true }
sp-offchain = { workspace = true }
sp-runtime = { features = ["serde"], workspace = true }
sp-session = { workspace = true }
sp-std = { workspace = true }
sp-storage = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-version = { workspace = true }

[build-dependencies]
substrate-wasm-builder = { optional = true, workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-executive/std",
	"frame-metadata-hash-extension/std",
	"frame-support/std",
	"frame-system-rpc-runtime-api/std",
	"frame-system/std",
	"log/std",
	"sp-io/std",
	"pallet-authorship/std",
	"pallet-balances/std",
	"pallet-grandpa/std",
	"pallet-rns-marketplace/std",
	"pallet-rns-registrar/std",
	"pallet-rns-resolvers/std",
	"rns-runtime-api/std",
	"pallet-rostro-bilateral-receipt/std",
	"pallet-rostro-canonical-files/std",
	"pallet-rostro-operator-state/std",
	"pallet-rostro-personhood/std",
	"pallet-rostro-rpc-method-policy/std",
	"rns-types/std",
	"rostro-multi-key/std",
	"pallet-sassafras/std",
	"pallet-session/std",
	"pallet-sudo/std",
	"pallet-timestamp/std",
	"pallet-transaction-payment-rpc-runtime-api/std",
	"pallet-transaction-payment/std",
	"zk-pki-pallet/std",
	"zk-pki-primitives/std",
	"zk-pki-tpm/std",
	"sp-api/std",
	"sp-block-builder/std",
	"sp-consensus-grandpa/std",
	"sp-consensus-sassafras/std",
	"sp-core/std",
	"sp-genesis-builder/std",
	"sp-inherents/std",
	"sp-offchain/std",
	"sp-runtime/std",
	"sp-session/std",
	"sp-std/std",
	"sp-storage/std",
	"sp-transaction-pool/std",
	"sp-version/std",
	"scale-info/std",
	"serde_json/std",
	"substrate-wasm-builder",
]
metadata-hash = ["substrate-wasm-builder/metadata-hash"]

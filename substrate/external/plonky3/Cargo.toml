[workspace]
resolver = "2"
members = [
    "air",
    "batch-stark",
    "challenger",
    "commit",
    "dft",
    "field",
    "fri",
    "goldilocks",
    "lookup",
    "matrix",
    "maybe-rayon",
    "mds",
    "merkle-tree",
    "monty-31",
    "multilinear-util",
    "poseidon1",
    "poseidon2",
    "poseidon2-air",
    "symmetric",
    "uni-stark",
    "util",
]

[workspace.lints]
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rust.unused_must_use = "deny"
rust.rust_2024_incompatible_pat = "warn"
rustdoc.all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

semicolon_if_nothing_returned = "warn"
match_bool = "warn"
needless_pass_by_value = "warn"

redundant_pub_crate = "allow"
too_long_first_doc_paragraph = "allow"
unused_peekable = "allow"
tuple_array_conversions = "allow"
transmute_undefined_repr = "allow"
cognitive_complexity = "allow"

[workspace.dependencies]
blake3 = { version = "1.8", default-features = false }
criterion = "0.8"
hashbrown = "0.17.0"
hex-literal = "1.1.0"
itertools = { version = "0.14.0", default-features = false, features = ["use_alloc"] }
libm = "0.2"
num-bigint = { version = "0.4.6", default-features = false }
paste = "1.0.15"
postcard = { version = "1.1.3", default-features = false }
proptest = "1.10"
rand = { version = "0.10.0", default-features = false }
rand_xoshiro = "0.8.0"
rayon = "1.11.0"
serde = { version = "1.0", default-features = false }
serde_json = "1.0.149"
sha2 = { version = "0.11.0", default-features = false }
sha3 = { version = "0.11.0", default-features = false }
spin = "0.10.0"
thiserror = { version = "2.0", default-features = false }
tiny-keccak = "2.0.2"
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
tracing-forest = "0.3.1"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["alloc"] }
transpose = "0.2.3"

p3-air = { path = "air", version = "0.5.1" }
p3-batch-stark = { path = "batch-stark", version = "0.5.1" }
p3-challenger = { path = "challenger", version = "0.5.1" }
p3-commit = { path = "commit", version = "0.5.1" }
p3-dft = { path = "dft", version = "0.5.1" }
p3-field = { path = "field", version = "0.5.1" }
p3-fri = { path = "fri", version = "0.5.1" }
p3-goldilocks = { path = "goldilocks", version = "0.5.1" }
p3-lookup = { path = "lookup", version = "0.5.1" }
p3-matrix = { path = "matrix", version = "0.5.1" }
p3-maybe-rayon = { path = "maybe-rayon", version = "0.5.1" }
p3-mds = { path = "mds", version = "0.5.1" }
p3-merkle-tree = { path = "merkle-tree", version = "0.5.1" }
p3-monty-31 = { path = "monty-31", version = "0.5.1" }
p3-multilinear-util = { path = "multilinear-util", version = "0.5.1" }
p3-poseidon1 = { path = "poseidon1", version = "0.5.1" }
p3-poseidon2 = { path = "poseidon2", version = "0.5.1" }
p3-poseidon2-air = { path = "poseidon2-air", version = "0.5.1" }
p3-symmetric = { path = "symmetric", version = "0.5.1" }
p3-uni-stark = { path = "uni-stark", version = "0.5.1" }
p3-util = { path = "util", version = "0.5.1" }

[workspace.package]
description = "Plonky3 is a toolkit for implementing polynomial IOPs (PIOPs), such as PLONK and STARKs."
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Plonky3/Plonky3"
homepage = "https://github.com/Plonky3/Plonky3"
keywords = ["cryptography", "SNARK", "PLONK", "FRI", "plonky3"]
categories = ["cryptography::cryptocurrencies"]

[profile.profiling]
inherits = "release"
debug = true

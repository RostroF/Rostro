[package]
name = "p3-batch-stark"
description = "Batched STARK wrapper atop p3-uni-stark that reuses FRI openings across instances."
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Plonky3/Plonky3"
homepage = "https://github.com/Plonky3/Plonky3"
keywords = ["cryptography", "SNARK", "PLONK", "FRI", "plonky3"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
p3-air = { path = "../air", version = "0.5.1" }
p3-challenger = { path = "../challenger", version = "0.5.1" }
p3-commit = { path = "../commit", version = "0.5.1" }
p3-field = { path = "../field", version = "0.5.1" }
p3-lookup = { path = "../lookup", version = "0.5.1" }
p3-matrix = { path = "../matrix", version = "0.5.1" }
p3-maybe-rayon = { path = "../maybe-rayon", version = "0.5.1" }
p3-uni-stark = { path = "../uni-stark", version = "0.5.1" }
p3-util = { path = "../util", version = "0.5.1" }

hashbrown = "0.17.0"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }

[dev-dependencies]
criterion = "0.8"
p3-commit = { path = "../commit" }
p3-dft = { path = "../dft" }
p3-fri = { path = "../fri" }
p3-matrix = { path = "../matrix" }
p3-merkle-tree = { path = "../merkle-tree" }
p3-symmetric = { path = "../symmetric" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand = { version = "0.10.0", default-features = false }

[features]
parallel = ["p3-maybe-rayon/parallel"]

[[bench]]
name = "prove_batch"
harness = false

[lints]
workspace = true

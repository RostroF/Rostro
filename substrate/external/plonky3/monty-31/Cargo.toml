[package]
name = "p3-monty-31"
description = "An implementation of a generic prime field F_p, where 2^30 < p < 2^31 using Montgomery arithmetic."
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Plonky3/Plonky3"
homepage = "https://github.com/Plonky3/Plonky3"
keywords = ["cryptography", "SNARK", "PLONK", "FRI", "plonky3"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
p3-dft = { path = "../dft", version = "0.5.1" }
p3-field = { path = "../field", version = "0.5.1" }
p3-matrix = { path = "../matrix", version = "0.5.1" }
p3-maybe-rayon = { path = "../maybe-rayon", version = "0.5.1" }
p3-mds = { path = "../mds", version = "0.5.1" }
p3-poseidon1 = { path = "../poseidon1", version = "0.5.1" }
p3-poseidon2 = { path = "../poseidon2", version = "0.5.1" }
p3-symmetric = { path = "../symmetric", version = "0.5.1" }
p3-util = { path = "../util", version = "0.5.1" }

itertools = { version = "0.14.0", default-features = false, features = ["use_alloc"] }
num-bigint = { version = "0.4.6", default-features = false }
paste = "1.0.15"
rand = { version = "0.10.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
spin = "0.10.0"
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }

[dev-dependencies]
proptest = "1.10"

[lints]
workspace = true

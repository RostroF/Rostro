[package]
name = "gemini-node"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Gemini node — Sassafras + GRANDPA over gemini-runtime. Phase Ring R3.6 testbed."
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "gemini-node"
path = "src/main.rs"

[dependencies]
async-channel = { workspace = true }
async-trait = { workspace = true, default-features = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
hex = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
jsonrpsee = { workspace = true, features = ["server"] }
log = { workspace = true, default-features = true }
tokio = { workspace = true, default-features = true }
tracing = { workspace = true, default-features = true }

# rc-* (client) crates
rc-basic-authorship = { workspace = true, default-features = true }
rc-cli = { workspace = true, default-features = true }
rc-client-api = { workspace = true, default-features = true }
rc-consensus = { workspace = true, default-features = true }
rc-consensus-grandpa = { workspace = true, default-features = true }
rc-consensus-slots = { workspace = true, default-features = true }
rc-executor = { workspace = true, default-features = true }
# Phase Star B8: PVM runtime executor. Type-swap of the FullClient
# happens in service.rs; rc-executor stays in for the RuntimeVersionOf
# trait + chain-spec genesis dispatch surface.
rostro-executor = { workspace = true, default-features = true }
rc-keystore = { workspace = true, default-features = true }
rc-network = { workspace = true, default-features = true }
rc-network-sync = { workspace = true, default-features = true }
rc-offchain = { workspace = true, default-features = true }
rc-rpc-api = { workspace = true, default-features = true }
rc-rpc-server = { workspace = true, default-features = true }
rc-service = { workspace = true, default-features = true }
rc-telemetry = { workspace = true, default-features = true }
rc-transaction-pool = { workspace = true, default-features = true }
rc-transaction-pool-api = { workspace = true, default-features = true }

# Frame
codec = { workspace = true, default-features = true, features = ["derive"] }
frame-support = { workspace = true, default-features = true }
frame-system = { workspace = true, default-features = true }
pallet-rns-registrar = { workspace = true, default-features = true }
rns-types = { workspace = true, default-features = true }
rns-runtime-api = { workspace = true, default-features = true }
pallet-rostro-canonical-files = { workspace = true, default-features = true }
pallet-rostro-rpc-method-policy = { workspace = true, default-features = true }
pallet-sassafras = { workspace = true, default-features = true }
pallet-transaction-payment = { workspace = true, default-features = true }
pallet-transaction-payment-rpc = { workspace = true, default-features = true }
substrate-frame-rpc-system = { workspace = true, default-features = true }

# Primitives
sp-api = { workspace = true, default-features = true }
sp-block-builder = { workspace = true, default-features = true }
sp-blockchain = { workspace = true, default-features = true }
sp-consensus-aura = { workspace = true, default-features = true }
sp-consensus-grandpa = { workspace = true, default-features = true }
sp-consensus-sassafras = { workspace = true, default-features = true, features = ["serde"] }
sp-consensus-slots = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true, features = ["bandersnatch-experimental"] }
sp-keystore = { workspace = true, default-features = true, features = ["bandersnatch-experimental"] }
sp-genesis-builder = { workspace = true, default-features = true }
sp-inherents = { workspace = true, default-features = true }
sp-io = { workspace = true, default-features = true }
sp-keyring = { workspace = true, default-features = true }
sp-runtime = { workspace = true, default-features = true }
sp-timestamp = { workspace = true, default-features = true }

# Rostro consensus client (Apache-2.0; we rely on it for the import-queue Verifier impl)
rostro-consensus-sassafras = { path = "../../utils/rostro-consensus-sassafras", default-features = true }

# Apache-2.0 RPC shield primitives. Substrate's `rc-rpc-server` already
# depends on this for the middleware adapter; we depend on it directly
# so `policy_refresh` can use the same `MethodPolicy` enum.
rostro-rpc-shield = { path = "../../utils/rostro-rpc-shield" }

# Apache-2.0 canonical-fetch protocol primitives. `file_check` uses the
# `LocalDirectoryFetchTransport` to drive the heal flow when
# `--canonical-files-dir` is set; `canonical_fetch_protocol` wires the
# signed-attestation libp2p protocol on top.
rostro-canonical-fetch = { path = "../../utils/rostro-canonical-fetch" }
rostro-chat-primitives = { path = "../../utils/rostro-chat-primitives" }
rostro-chat-ephemeral-store = { path = "../../utils/rostro-chat-ephemeral-store" }
rostro-chat-sealed-sender = { path = "../../utils/rostro-chat-sealed-sender" }
rostro-chat-onion = { path = "../../utils/rostro-chat-onion" }
rostro-chat-membership-auth = { path = "../../utils/rostro-chat-membership-auth" }
rostro-node-identity = { path = "../../utils/rostro-node-identity" }
serde = { workspace = true, default-features = true, features = ["derive"] }

# Same Ed25519 backing crate the rest of Rostro uses (per crypto_stack_v1
# memory). The canonical-fetch attestation server signs responses with
# the libp2p node-identity Ed25519 key, re-imported into ed25519-zebra
# at startup.
ed25519-zebra = { workspace = true, default-features = true }

# Used by canonical_fetch_protocol to parse the node-identity key file
# (hex-encoded 32 bytes), matching sc-network's on-disk convention.
array-bytes = { workspace = true }

# `connect_gate`'s drift ledger + rate limiter are accessed concurrently
# from the attest server task and the asker task; parking_lot::Mutex
# gives us no-poisoning + faster-than-std shared mutex semantics for
# the tight critical sections.
parking_lot = { workspace = true, default-features = true }

# `attest_asker` generates a fresh nonce per outbound attest request.
# thread-local RNG, OS-seeded.
rand = { workspace = true, default-features = true }

# Phase Z (validator-channel) deps: pure crypto + protocol via the
# rostro-validator-channel crate; X25519 ephemeral DH at the
# gemini-node call-sites needs x25519-dalek directly; rand_core for
# the OS RNG used during ephemeral keygen. (tokio is already a dep
# above with default-features, which gives us rt + time.)
rostro-validator-channel = { path = "../../utils/rostro-validator-channel" }
pallet-rostro-key-lineage = { workspace = true, default-features = true }
# ML-KEM-768 encap/decap + the hybrid combine for the v3 handshake
# (docs/PQ-TRANSPORT.md). Same crate the wire format's sizes come from.
rostro-hybrid-kex = { workspace = true, default-features = true }
x25519-dalek = { workspace = true, features = ["static_secrets"] }
rand_core = { workspace = true, features = ["getrandom"] }

# The runtime
gemini-runtime = { workspace = true, default-features = true }

# zkpki primitives — runtime API trait + CertAuthInfo struct used
# by chat_rpc to authenticate end-user chat-send calls against a
# zkpki cert's HW-attested device key.
zk-pki-primitives = { workspace = true, default-features = true }

# zkpki HIP verification — chat-auth session handshake verifies a fresh
# CanonicalHipProof against the cert's enrolled genesis fingerprint
# (verify_hip_proof_against_genesis) off-chain in the RPC handler.
zk-pki-hip = { workspace = true, default-features = true }

[build-dependencies]
substrate-build-script-utils = { workspace = true, default-features = true }

[features]
default = []

# Forwarded to the runtime blob build (star scenarios only; see the
# runtime's feature of the same name — never ship a lab-fast binary to a
# real chain).
lab-fast-lifecycle = ["gemini-runtime/lab-fast-lifecycle"]

# Lab-only chat diagnostics. When OFF (the canonical release default),
# every success-path chat auth/admission/delivery log statement is
# `#[cfg]`-removed, so the canonical binary provably contains no such
# log literal (verify: `strings` finds none). The lab rig builds with
# this ON to keep the E2E verification loop. See docs/GUARD-PRIVACY-AUDIT.md.
chat-diagnostics = []

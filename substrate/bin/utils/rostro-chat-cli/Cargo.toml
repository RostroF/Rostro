[package]
name = "rostro-chat-cli"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Test-harness CLI binary that exercises the Rostro chat layer end-to-end against a running gemini-node's JSON-RPC. Stands in for the future mobile-app SDK: holds the user's chat-identity Ed25519 keypair locally, builds + signs + sealed-sender-encrypts the envelope on-device, chunks + checksums it on-device (docs/CHAT-SHARE-CHUNKING.md), hex-encodes the prepared batch, and calls `chat_send_prepared`. On the receive side, calls `chat_fetch_shares`, groups + checksum-verifies + reassembles + unseals + verifies locally. The gemini-node sees only ciphertext + routing metadata, never plaintext or user keys."
publish = false

[lints]
workspace = true

[[bin]]
name = "rostro-chat-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread"] }
jsonrpsee = { workspace = true, features = ["http-client", "async-client", "macros"] }
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
hex = { workspace = true, default-features = true }
anyhow = { workspace = true, default-features = true }
rand_core = { workspace = true, features = ["getrandom"] }
ed25519-zebra = { workspace = true, default-features = true }
codec = { workspace = true, default-features = true, features = ["derive"] }
log = { workspace = true, default-features = true }

rostro-chat-primitives = { path = "../../../utils/rostro-chat-primitives" }
rostro-chat-sealed-sender = { path = "../../../utils/rostro-chat-sealed-sender" }

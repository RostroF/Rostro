[package]
name = "rc-executor"
version = "0.48.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage.workspace = true
repository.workspace = true
description = "A crate that provides means of executing/dispatching calls into the runtime."
documentation = "https://docs.rs/rc-executor"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[[bench]]
name = "bench"
harness = false

[dependencies]
parking_lot = { workspace = true, default-features = true }
schnellru = { workspace = true }
tracing = { workspace = true, default-features = true }

codec = { workspace = true, default-features = true }
rc-executor-common = { default-features = true, workspace = true }
rc-executor-polkavm = { default-features = true, workspace = true }
rc-executor-wasmtime = { default-features = true, workspace = true }
rp-api = { default-features = true, workspace = true }
rp-core = { default-features = true, workspace = true }
rp-externalities = { default-features = true, workspace = true }
rp-io = { default-features = true, workspace = true }
rp-panic-handler = { default-features = true, workspace = true }
rp-runtime-interface = { default-features = true, workspace = true }
rp-trie = { default-features = true, workspace = true }
rp-version = { default-features = true, workspace = true }
rp-wasm-interface = { default-features = true, workspace = true }

[dev-dependencies]
array-bytes = { workspace = true, default-features = true }
assert_matches = { workspace = true }
criterion = { workspace = true, default-features = true }
num_cpus = { workspace = true }
paste = { workspace = true, default-features = true }
rc-runtime-test = { workspace = true }
rc-tracing = { default-features = true, workspace = true }
rp-crypto-hashing = { default-features = true, workspace = true }
rp-maybe-compressed-blob = { default-features = true, workspace = true }
rp-runtime = { default-features = true, workspace = true }
rp-state-machine = { default-features = true, workspace = true }
rp-tracing = { default-features = true, workspace = true }
substrate-test-runtime = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
wat = { workspace = true }

[features]
default = ["std"]
# This crate does not have `no_std` support, we just require this for tests
std = [
	"rp-api/std",
	"rp-core/std",
	"rp-externalities/std",
	"rp-io/std",
	"rp-runtime-interface/std",
	"rp-trie/std",
	"rp-version/std",
	"rp-wasm-interface/std",
]
wasm-extern-trace = []

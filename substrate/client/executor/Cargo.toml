[package]
name = "rc-executor"
version = "0.48.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage.workspace = true
repository.workspace = true
description = "Runtime-executor trait vocabulary for the client stack (RostroVM executes; see rostro-executor)."
documentation = "https://docs.rs/rc-executor"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

# wasm-cull W4: the wasm execution engines (wasmtime backend, WasmExecutor,
# NativeElseWasmExecutor, the `wasmtime-backend` feature) were deleted.
# RostroCodeExecutor (`rostro-executor`) is the only runtime executor; this
# crate keeps the executor-facing traits + error types the client stack is
# written against.

[dependencies]
codec = { workspace = true, default-features = true }
rc-executor-common = { default-features = true, workspace = true }
sp-core = { default-features = true, workspace = true }
sp-version = { default-features = true, workspace = true }
sp-wasm-interface = { default-features = true, workspace = true }

[features]
default = ["std"]
std = [
	"sp-core/std",
	"sp-version/std",
	"sp-wasm-interface/std",
]

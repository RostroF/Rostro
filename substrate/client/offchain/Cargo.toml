[package]
description = "Substrate offchain workers"
name = "rc-offchain"
version = "51.0.0"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
bytes = { workspace = true, default-features = true }
codec = { features = ["derive"], workspace = true, default-features = true }
fnv = { workspace = true }
futures = { workspace = true }
futures-timer = { workspace = true }
http-body-util = { workspace = true }
hyper = { features = ["http1", "http2"], workspace = true, default-features = true }
hyper-rustls = { workspace = true }
hyper-util = { features = ["client-legacy", "http1", "http2"], workspace = true }
num_cpus = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true, default-features = true }
rand = { workspace = true, default-features = true }
rustls = { workspace = true }
rc-client-api = { default-features = true, workspace = true }
rc-network = { default-features = true, workspace = true }
rc-network-types = { default-features = true, workspace = true }
rc-transaction-pool-api = { default-features = true, workspace = true }
rc-utils = { default-features = true, workspace = true }
rp-api = { default-features = true, workspace = true }
rp-core = { default-features = true, workspace = true }
rp-externalities = { default-features = true, workspace = true }
rp-keystore = { default-features = true, workspace = true }
rp-offchain = { default-features = true, workspace = true }
rp-runtime = { default-features = true, workspace = true }
threadpool = { workspace = true }
tracing = { workspace = true, default-features = true }

[dev-dependencies]
async-trait = { workspace = true }
rc-block-builder = { default-features = true, workspace = true }
rc-client-db = { default-features = true, workspace = true }
rc-transaction-pool = { default-features = true, workspace = true }
rp-consensus = { default-features = true, workspace = true }
rp-tracing = { default-features = true, workspace = true }
substrate-test-runtime-client = { workspace = true }
tokio = { workspace = true, default-features = true }

[features]
default = []

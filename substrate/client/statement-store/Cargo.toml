[package]
name = "rc-statement-store"
version = "27.0.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage.workspace = true
repository.workspace = true
description = "Substrate statement store."
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
async-channel = { workspace = true }
futures = { workspace = true }
itertools = { workspace = true }
log = { workspace = true, default-features = true }
parity-db = { workspace = true }
parking_lot = { workspace = true, default-features = true }
prometheus-endpoint = { default-features = true, workspace = true }
rc-client-api = { default-features = true, workspace = true }
rc-keystore = { default-features = true, workspace = true }
rc-network-statement = { default-features = true, workspace = true }
rc-utils = { workspace = true }
rp-api = { default-features = true, workspace = true }
rp-blockchain = { default-features = true, workspace = true }
rp-core = { default-features = true, workspace = true }
rp-runtime = { default-features = true, workspace = true }
rp-statement-store = { default-features = true, workspace = true }
rp-storage = { default-features = true, workspace = true }
tokio = { features = ["time"], workspace = true, default-features = true }

[dev-dependencies]
criterion = { workspace = true, default-features = true }
rp-tracing = { workspace = true, default-features = false }
tempfile = { workspace = true }

[[bench]]
name = "statement_store"
harness = false
required-features = []

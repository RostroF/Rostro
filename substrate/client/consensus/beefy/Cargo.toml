[package]
name = "rc-consensus-beefy"
version = "35.0.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
repository.workspace = true
description = "BEEFY Client gadget for substrate"
homepage.workspace = true

[lints]
workspace = true

[dependencies]
array-bytes = { workspace = true, default-features = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
codec = { features = ["derive"], workspace = true, default-features = true }
futures = { workspace = true }
log = { workspace = true, default-features = true }
parking_lot = { workspace = true, default-features = true }
prometheus-endpoint = { default-features = true, workspace = true }
rc-client-api = { default-features = true, workspace = true }
rc-consensus = { default-features = true, workspace = true }
rc-network = { default-features = true, workspace = true }
rc-network-gossip = { default-features = true, workspace = true }
rc-network-sync = { default-features = true, workspace = true }
rc-network-types = { default-features = true, workspace = true }
rc-utils = { default-features = true, workspace = true }
rp-api = { default-features = true, workspace = true }
rp-application-crypto = { default-features = true, workspace = true }
rp-arithmetic = { default-features = true, workspace = true }
rp-blockchain = { default-features = true, workspace = true }
rp-consensus = { default-features = true, workspace = true }
rp-consensus-beefy = { default-features = true, workspace = true }
rp-core = { default-features = true, workspace = true }
rp-keystore = { default-features = true, workspace = true }
rp-runtime = { default-features = true, workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = true }
wasm-timer = { workspace = true }

[dev-dependencies]
rc-block-builder = { default-features = true, workspace = true }
rc-network-test = { workspace = true }
serde = { workspace = true, default-features = true }
rp-mmr-primitives = { default-features = true, workspace = true }
rp-tracing = { default-features = true, workspace = true }
substrate-test-runtime-client = { workspace = true }

[features]
# This feature adds BLS crypto primitives. It should not be used in production since
# the BLS implementation and interface may still be subject to significant change.
bls-experimental = [
	"rp-application-crypto/bls-experimental",
	"rp-consensus-beefy/bls-experimental",
	"rp-core/bls-experimental",
]

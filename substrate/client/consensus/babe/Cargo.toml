[package]
name = "rc-consensus-babe"
version = "0.56.0"
authors.workspace = true
description = "BABE consensus algorithm for substrate"
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/rc-consensus-babe"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
async-trait = { workspace = true }
codec = { features = ["derive"], workspace = true, default-features = true }
fork-tree = { default-features = true, workspace = true }
futures = { workspace = true }
log = { workspace = true, default-features = true }
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true, default-features = true }
parking_lot = { workspace = true, default-features = true }
prometheus-endpoint = { default-features = true, workspace = true }
rc-client-api = { default-features = true, workspace = true }
rc-consensus = { default-features = true, workspace = true }
rc-consensus-epochs = { default-features = true, workspace = true }
rc-consensus-slots = { default-features = true, workspace = true }
rc-telemetry = { default-features = true, workspace = true }
rc-transaction-pool-api = { default-features = true, workspace = true }
rp-api = { default-features = true, workspace = true }
rp-application-crypto = { default-features = true, workspace = true }
rp-block-builder = { default-features = true, workspace = true }
rp-blockchain = { default-features = true, workspace = true }
rp-consensus = { default-features = true, workspace = true }
rp-consensus-babe = { default-features = true, workspace = true }
rp-consensus-slots = { default-features = true, workspace = true }
rp-core = { default-features = true, workspace = true }
rp-crypto-hashing = { default-features = true, workspace = true }
rp-inherents = { default-features = true, workspace = true }
rp-keystore = { default-features = true, workspace = true }
rp-runtime = { default-features = true, workspace = true }
rp-timestamp = { default-features = true, workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rc-block-builder = { default-features = true, workspace = true }
rc-network-test = { workspace = true }
rp-keyring = { default-features = true, workspace = true }
rp-tracing = { default-features = true, workspace = true }
substrate-test-runtime-client = { workspace = true }
tokio = { workspace = true, default-features = true }

[package]
name = "rc-sync-state-rpc"
version = "0.56.0"
authors.workspace = true
description = "A RPC handler to create sync states for light clients."
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true, default-features = true }
jsonrpsee = { features = ["client-core", "macros", "server-core"], workspace = true }
rc-chain-spec = { default-features = true, workspace = true }
rc-client-api = { default-features = true, workspace = true }
rc-consensus-babe = { default-features = true, workspace = true }
rc-consensus-epochs = { default-features = true, workspace = true }
rc-consensus-grandpa = { default-features = true, workspace = true }
serde = { features = ["derive"], workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
rp-blockchain = { default-features = true, workspace = true }
rp-runtime = { default-features = true, workspace = true }
thiserror = { workspace = true }

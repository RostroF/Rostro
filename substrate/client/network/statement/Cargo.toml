[package]
description = "Substrate statement protocol"
name = "rc-network-statement"
version = "0.38.0"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/rc-network-statement"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
test-helpers = []

[dependencies]
array-bytes = { workspace = true, default-features = true }
async-channel = { workspace = true }
codec = { features = ["derive"], workspace = true, default-features = true }
futures = { workspace = true }
governor = { workspace = true }
log = { workspace = true, default-features = true }
prometheus-endpoint = { default-features = true, workspace = true }
rand = { workspace = true, default-features = true }
rc-network = { default-features = true, workspace = true }
rc-network-common = { default-features = true, workspace = true }
rc-network-sync = { default-features = true, workspace = true }
rc-network-types = { default-features = true, workspace = true }
rp-consensus = { default-features = true, workspace = true }
rp-runtime = { default-features = true, workspace = true }
rp-statement-store = { default-features = true, workspace = true }
tokio = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
criterion = { workspace = true, default-features = true }
rc-keystore = { default-features = true, workspace = true }
rc-statement-store = { default-features = true, workspace = true }
rp-api = { default-features = true, workspace = true }
rp-blockchain = { default-features = true, workspace = true }
rp-core = { default-features = true, workspace = true }
rp-keyring = { default-features = true, workspace = true }
substrate-test-runtime-client = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "statement_network"
harness = false
required-features = ["test-helpers"]

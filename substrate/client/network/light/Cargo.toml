[package]
description = "Substrate light network protocol"
name = "rc-network-light"
version = "0.55.0"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/rc-network-light"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
array-bytes = { workspace = true, default-features = true }
async-channel = { workspace = true }
codec = { features = ["derive"], workspace = true, default-features = true }
futures = { workspace = true }
log = { workspace = true, default-features = true }
prost = { workspace = true }
rc-client-api = { default-features = true, workspace = true }
rc-network = { default-features = true, workspace = true }
rc-network-types = { default-features = true, workspace = true }
rp-blockchain = { default-features = true, workspace = true }
rp-core = { default-features = true, workspace = true }
rp-runtime = { default-features = true, workspace = true }
thiserror = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }

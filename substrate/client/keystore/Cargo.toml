[package]
name = "rc-keystore"
version = "40.0.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage.workspace = true
repository.workspace = true
description = "Keystore (and session key management) for ed25519 based chains like Polkadot."
documentation = "https://docs.rs/rc-keystore"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
array-bytes = { workspace = true, default-features = true }
parking_lot = { workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
rp-application-crypto = { default-features = true, workspace = true }
rp-core = { default-features = true, workspace = true }
rp-keystore = { default-features = true, workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# This feature adds BLS crypto primitives.
# It should not be used in production since the implementation and interface may still
# be subject to significant changes.
bls-experimental = [
	"rp-core/bls-experimental",
	"rp-keystore/bls-experimental",
]

# This feature adds Bandersnatch crypto primitives.
# It should not be used in production since the implementation and interface may still
# be subject to significant changes.
bandersnatch-experimental = [
	"rp-application-crypto/bandersnatch-experimental",
	"rp-core/bandersnatch-experimental",
	"rp-keystore/bandersnatch-experimental",
]

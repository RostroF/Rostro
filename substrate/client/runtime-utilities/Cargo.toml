[package]
description = "Substrate client utilities for frame runtime functions calls."
name = "rc-runtime-utilities"
version = "0.8.0"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/sc-metadata"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { workspace = true, default-features = true }
rc-executor = { default-features = true, workspace = true }
rc-executor-common = { default-features = true, workspace = true }
rp-core = { default-features = true, workspace = true }
rp-crypto-hashing = { default-features = true, workspace = true }
rp-state-machine = { default-features = true, workspace = true }
rp-wasm-interface = { default-features = true, workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
rp-io = { default-features = true, workspace = true }
rp-version = { default-features = true, workspace = true }
subxt = { workspace = true, features = ["native"] }

[package]
description = "Gossiping for the Substrate network protocol"
name = "rc-network-gossip"
version = "0.56.0"
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/rc-network-gossip"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
ahash = { workspace = true }
futures = { workspace = true }
futures-timer = { workspace = true }
log = { workspace = true, default-features = true }
prometheus-endpoint = { default-features = true, workspace = true }
rc-network = { default-features = true, workspace = true }
rc-network-common = { default-features = true, workspace = true }
rc-network-sync = { default-features = true, workspace = true }
rc-network-types = { default-features = true, workspace = true }
schnellru = { workspace = true }
rp-runtime = { default-features = true, workspace = true }
tracing = { workspace = true, default-features = true }

[dev-dependencies]
async-trait = { workspace = true }
codec = { features = ["derive"], workspace = true, default-features = true }
quickcheck = { workspace = true }
substrate-test-runtime-client = { workspace = true }
tokio = { workspace = true, default-features = true }

[package]
name = "rc-chain-spec"
version = "49.0.0"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later WITH Classpath-exception-2.0"
homepage.workspace = true
repository.workspace = true
description = "Substrate chain configurations."
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
array-bytes = { workspace = true, default-features = true }
clap = { features = ["derive"], optional = true, workspace = true }
codec = { features = ["derive"], workspace = true }
docify = { workspace = true }
memmap2 = { workspace = true }
rc-chain-spec-derive = { default-features = true, workspace = true }
rc-client-api = { default-features = true, workspace = true }
rc-executor = { default-features = true, workspace = true }
rc-network = { default-features = true, workspace = true }
rc-telemetry = { default-features = true, workspace = true }
serde = { features = ["derive"], workspace = true, default-features = true }
serde_json = { workspace = true, default-features = true }
rp-blockchain = { default-features = true, workspace = true }
rp-core = { default-features = true, workspace = true }
rp-crypto-hashing = { default-features = true, workspace = true }
rp-genesis-builder = { default-features = true, workspace = true }
rp-io = { workspace = true }
rp-runtime = { default-features = true, workspace = true }
rp-state-machine = { default-features = true, workspace = true }
rp-tracing = { default-features = true, workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
regex = { workspace = true }
rp-application-crypto = { features = ["serde"], workspace = true, default-features = false }
rp-consensus-babe = { features = ["serde"], workspace = true, default-features = false }
rp-keyring = { default-features = true, workspace = true }
substrate-test-runtime = { workspace = true }

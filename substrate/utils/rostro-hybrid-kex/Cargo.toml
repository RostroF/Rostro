[package]
name = "rostro-hybrid-kex"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "X25519MLKEM768-style hybrid key agreement for Rostro transport handshakes. Combines an ML-KEM-768 shared secret with an X25519 shared secret via HKDF-SHA256, so recorded traffic stays confidential if either component is broken (Shor kills X25519, cryptanalysis could kill the young lattice scheme — never both, we hope). Also home of the NIST ACVP known-answer tests for the vendored ml-kem crate, whose crates.io tarball excludes upstream's own KAT files."
publish = false

[lints]
workspace = true

[dependencies]
hkdf = { workspace = true }
ml-kem = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
hex = "0.4"
x25519-dalek = { workspace = true, features = ["static_secrets"] }

[features]
default = ["std"]
std = ["sha2/std"]

[package]
name = "substrate-wasm-builder"
version = "32.0.0"
authors.workspace = true
description = "Utility for building WASM binaries"
edition.workspace = true
repository.workspace = true
license = "Apache-2.0"
homepage.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
build-helper = { workspace = true }
cargo_metadata = { workspace = true }
console = { workspace = true }
filetime = { workspace = true }
jobserver = { workspace = true }
polkavm-linker = { workspace = true }
strum = { features = ["derive"], workspace = true, default-features = true }
tempfile = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

shlex = { workspace = true }

# wasm-cull W5 (per D1): the `metadata-hash` feature was deleted. Its
# build-time hash step executed the runtime blob through the removed wasm
# executor; if enabled-mode CheckMetadataHash is ever needed, extraction
# must be ported to rostro-executor (docs/WASM-SURFACE-AUDIT.md).

[package]
name = "rostro-chat-onion"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "One-hop onion wrapping for the Rostro chat layer (Phase 4, network-origin anonymity). Nested sealed-sender layers split who-from-where across two relays: the guard learns the sender + next hop but not the destination; relay-2 learns the destination but not the sender. Fixed-size padding defeats size correlation. Pure crypto over rostro-chat-sealed-sender; no transport, no async. Sphinx is the documented upgrade path if more hops are ever added."
publish = false

[lints]
workspace = true

[dependencies]
codec = { features = ["derive"], workspace = true }
rostro-chat-sealed-sender = { path = "../rostro-chat-sealed-sender" }
zeroize = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }

[dev-dependencies]
rand_chacha = { workspace = true, default-features = true }
x25519-dalek = { workspace = true, features = ["static_secrets"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"rostro-chat-sealed-sender/std",
	"zeroize/std",
]

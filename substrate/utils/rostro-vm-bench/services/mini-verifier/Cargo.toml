# SPDX-License-Identifier: Apache-2.0 OR MIT
# Copyright (C) Rostro Foundation
#
# Mini Plonky3-shaped verifier benchmark — Fiat-Shamir transcript +
# FRI-fold linear combination + AIR constraint eval, all in Goldilocks
# field with WIDTH=8 Poseidon2 hash. Shape mirrors what `p3_uni_stark::verify`
# does in its hot loop without dragging in the full Plonky3 dep graph
# (which transitively requires `tracing` → atomics, incompatible with
# javm's `max-atomic-width: 0` target). Hand-written Goldilocks + Poseidon2
# instead, using the identical round constants from `p3-goldilocks` so
# the algorithm is bit-exact with `default_goldilocks_poseidon2_8`.
#
# Designed to be PR-able into JAR/Grey's `grey/services/benches/` set
# alongside blake2b/ed25519/keccak/etc. Fills a gap in Wei's bench
# coverage (no STARK-shaped workload today). The wasm32 entry
# (`src/wasm.rs`) is the only Rostro-side addition; cfg-gated so it's
# a no-op for upstream.

[package]
name = "rostro-bench-mini-verifier"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Fiat-Shamir transcript + FRI-fold + AIR-eval-shaped workload over Goldilocks-Poseidon2-WIDTH8. Mirrors Plonky3 STARK verifier hot loop."
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
javm-builtins = { package = "rostro-bench-javm-builtins", path = "../javm-builtins" }
gp = { package = "rostro-bench-goldilocks-poseidon2", path = "../goldilocks-poseidon2" }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = "0.32.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("javm", "polkavm"))', 'cfg(target_os, values("none"))', 'cfg(target_arch, values("wasm32"))'] }

[workspace]

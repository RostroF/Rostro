# SPDX-License-Identifier: Apache-2.0 OR MIT
# Copyright (C) Rostro Foundation
#
# Poseidon2-WIDTH8-only benchmark — N permutations on a chained state.
# Decomposes the hash cost out of the mini-verifier workload so we can see
# per-VM how well each handles the canonical Plonky3 hash inner loop in
# isolation.

[package]
name = "rostro-bench-poseidon2-perm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Poseidon2-Goldilocks-WIDTH8 permutation tight loop benchmark."
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
javm-builtins = { package = "rostro-bench-javm-builtins", path = "../javm-builtins" }
gp = { package = "rostro-bench-goldilocks-poseidon2", path = "../goldilocks-poseidon2" }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = "0.32.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("javm", "polkavm"))', 'cfg(target_os, values("none"))', 'cfg(target_arch, values("wasm32"))'] }

[workspace]

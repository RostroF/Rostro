# ECDSA verify on NIST P-521 — the curve TPM2 hardware attestation uses.
# Pure Rust (RustCrypto `p521`), no_std with bump allocator.

[package]
name = "rostro-bench-p521"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NIST P-521 ECDSA verify benchmark — TPM2-attestation-shaped — javm/polkavm/wasm32"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
p521 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
# Force num-traits/libm — wasm32v1-none + RISC-V no_std targets lack the
# inherent f64::div_euclid, so num-traits's `libm` feature is required to
# polyfill it. Without this the p521 transitive dep tree fails to compile.
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
rand_core = { version = "0.6", default-features = false }
javm-builtins = { package = "rostro-bench-javm-builtins", path = "../javm-builtins" }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = "0.32.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("javm", "polkavm"))', 'cfg(target_os, values("none"))', 'cfg(target_arch, values("wasm32"))'] }

[workspace]

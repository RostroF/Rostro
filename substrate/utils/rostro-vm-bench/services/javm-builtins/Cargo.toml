[package]
name = "rostro-bench-javm-builtins"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Vendored javm-builtins (Apache-2.0, JAR contributors) — compiler builtins + panic handler + JAVM entry macro for freestanding RISC-V service crates"
publish = false

[lib]
name = "javm_builtins"
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("javm", "polkavm"))', 'cfg(target_os, values("none"))'] }

[workspace]

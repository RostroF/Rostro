#
# FRI-fold-tree benchmark — explicit merkle-tree walk with scattered
# sibling lookups across log_2(N) levels per query. Exposes memory
# traffic patterns the mini-verifier doesn't, since mini-verifier
# hashes the same state buffer repeatedly (cache-warm) while FRI
# walks scattered indices in a flat tree buffer (cache pressure).

[package]
name = "rostro-bench-fri-fold-tree"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "FRI fold tree walk benchmark — scattered merkle tree lookups + Poseidon2 + Goldilocks linear combination, mirroring p3_fri::verify hot loop."
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
javm-builtins = { package = "rostro-bench-javm-builtins", path = "../javm-builtins" }
gp = { package = "rostro-bench-goldilocks-poseidon2", path = "../goldilocks-poseidon2" }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = "0.32.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("javm", "polkavm"))', 'cfg(target_os, values("none"))', 'cfg(target_arch, values("wasm32"))'] }

[workspace]

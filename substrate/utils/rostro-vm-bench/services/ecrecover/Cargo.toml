[package]
name = "rostro-bench-ecrecover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "secp256k1 ecrecover benchmark — compiled to javm/polkavm/wasm32 for VM comparison"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
javm-builtins = { package = "rostro-bench-javm-builtins", path = "../javm-builtins" }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = "0.32.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("javm", "polkavm"))', 'cfg(target_os, values("none"))', 'cfg(target_arch, values("wasm32"))'] }

[workspace]

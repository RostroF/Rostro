# SPDX-License-Identifier: Apache-2.0
# Copyright (C) Rostro Foundation
# Curve-conversion micro-pipeline that mirrors the OPRF inner loop used by
# pallet-rostro-personhood (`rostro-curve25519`). One iteration runs:
#   bytes -> hash-to-curve (Ristretto via Elligator2) -> EdwardsPoint
#   EdwardsPoint -> Ristretto compress -> 32 bytes
#   32 bytes -> Ristretto decompress -> EdwardsPoint
#   point.scalar_mul(scalar) -> EdwardsPoint
# This is the "conversion math from one curve form to another, reduced,
# mixed, through another" workload referenced for instruction-set design.

[package]
name = "rostro-bench-curve-conversion"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Ristretto+Edwards25519 conversion pipeline (Elligator2 hash-to-curve, compress, decompress, scalar mul)"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "precomputed-tables"] }
# See p521/Cargo.toml — num-traits/libm needed for no_std f64 polyfill.
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
javm-builtins = { package = "rostro-bench-javm-builtins", path = "../javm-builtins" }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = "0.32.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("javm", "polkavm"))', 'cfg(target_os, values("none"))', 'cfg(target_arch, values("wasm32"))'] }

[workspace]

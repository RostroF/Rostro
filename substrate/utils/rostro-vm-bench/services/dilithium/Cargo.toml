# ML-DSA (Dilithium) FIPS-204 signature verify benchmark — built specifically
# for Rostro to measure PQ-sig overhead in the same VM dispatch loop the rest
# of the bench harness exercises. Pure Rust (RustCrypto `ml-dsa` crate), so
# it compiles to wasm32v1-none, javm, and polkavm equally.

[package]
name = "rostro-bench-dilithium"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ML-DSA-65 (Dilithium-3) signature verify benchmark — javm/polkavm/wasm32"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
# fips204 is a self-contained pure-Rust FIPS-204 (ML-DSA) implementation by
# eric-schorn. Chosen over RustCrypto's `ml-dsa` because ml-dsa pulls sha3
# with default features (std-enabling), which Cargo can't override from the
# downstream service crate. fips204 vendors its own SHA-3 / SHAKE128/256.
#
# Conformance: fips204 includes NIST ACVP KAT vectors (tests/test_vectors/)
# and the bench function below additionally checks a known-good
# (pk_hash, sig_hash, message) tuple at runtime so we have an in-loop
# correctness assertion alongside the perf measurement.
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65"] }
rand_core = { version = "0.6", default-features = false }
javm-builtins = { package = "rostro-bench-javm-builtins", path = "../javm-builtins" }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = "0.32.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("javm", "polkavm"))', 'cfg(target_os, values("none"))', 'cfg(target_arch, values("wasm32"))'] }

[workspace]

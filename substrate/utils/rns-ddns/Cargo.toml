[package]
name = "rns-ddns"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Rostro Name Service (RNS) DDNS server scaffold — authority + dns_server + metrics module surfaces. Originally authored as PNS by Anthony Czarnik; vendored into Rostro 2026-05-03. Deliberately excludes hickory/tokio (snorkel will land that in a follow-up)."
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true, default-features = true }
tracing = { workspace = true, default-features = true }

rns-types = { workspace = true, default-features = true }

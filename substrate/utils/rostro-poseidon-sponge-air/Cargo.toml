[package]
name = "rostro-poseidon-sponge-air"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Sponge wrapper around the Goldilocks-Poseidon2 WIDTH=8 permutation AIR. Provides a single service bus (BUS_POSEIDON_SPONGE) that consumers query with `(input[8], output[8])` to assert `output = Permutation(input)`. Internally batches the four AIRs that realize one full permutation: a shell AIR (this crate) doing the pre-MDS linear layer + bus glue, plus the three round AIRs from rostro-poseidon-air (external_initial + internal + external_terminal). Building block for hash_to_field, hash_to_curve, and any PoP AIR that needs Poseidon2 hashing."
publish = false

[lints]
workspace = true

[dependencies]
p3-air        = { workspace = true }
p3-field      = { workspace = true }
p3-goldilocks = { workspace = true }
p3-lookup     = { workspace = true }
p3-matrix     = { workspace = true }
p3-symmetric  = { workspace = true }
rostro-poseidon-air = { workspace = true }

[dev-dependencies]
p3-poseidon2  = { workspace = true }
rand = { version = "0.8", default-features = false, features = ["std_rng"] }

[features]
default = ["std"]
std = []

[package]
name = "rostro-watchdog-client"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Client for the Rostro watchdog Unix-domain-socket protocol. v0.1 advisory client: heartbeat liveness probe (kill-watchdog → gemini-node detects missed beats → graceful shutdown), plus Sign / GetPubkey RPCs exposed for v0.2+ libp2p remote-signer wiring. Apache-2.0 so the heavy logic stays out of the GPL3 gemini-node crate."
publish = false

[lints]
workspace = true

[dependencies]
rostro-watchdog = { path = "../rostro-watchdog" }
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
log = { workspace = true, default-features = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[features]
default = []

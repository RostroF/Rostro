[package]
name = "rostro-consensus-sassafras"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Phase Ring R2: node-side client for Sassafras consensus (the protocol Polkadot rebranded as Safrole). Apache-2.0, written from scratch — upstream paritytech/polkadot-sdk has the pallet but no client crate. Lives outside substrate/client/ to keep clear of GPL-3.0 contamination."
publish = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
codec = { workspace = true, features = ["derive"], default-features = true }
futures = { workspace = true }
log = { workspace = true }
rc-client-api = { workspace = true, default-features = true }
rc-consensus = { workspace = true, default-features = true }
rc-consensus-slots = { workspace = true, default-features = true }
rc-telemetry = { workspace = true, default-features = true }
sp-api = { workspace = true, default-features = true }
sp-application-crypto = { workspace = true, default-features = true }
sp-blockchain = { workspace = true, default-features = true }
sp-consensus = { workspace = true, default-features = true }
sp-consensus-sassafras = { features = ["serde"], workspace = true, default-features = true }
sp-consensus-slots = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true, features = ["bandersnatch-experimental"] }
sp-inherents = { workspace = true, default-features = true }
sp-io = { workspace = true, default-features = true }
sp-keystore = { workspace = true, default-features = true, features = ["bandersnatch-experimental"] }
sp-runtime = { workspace = true, default-features = true }
thiserror = { workspace = true }

[dev-dependencies]
rand = "0.8"
sp-consensus = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true, features = ["bandersnatch-experimental", "full_crypto"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[package]
name = "rostro-guest-crypto"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
homepage.workspace = true
repository.workspace = true
description = "The single facade through which Rostro runtime code reaches cryptography: per-cipher backend routing (sp_io host functions / RVM ecalli intrinsics / reference crates) plus RostroCurveHooks for the arkworks ext curves."

[lints]
workspace = true

[dependencies]
# The hooked curve types (and the ark ext stack) come via rostro-curve-hooks;
# the ark deps kept here back the native bls381_pairing_check reference path.
ark-bls12-381 = { workspace = true, features = ["curve"] }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true }
rostro-curve-hooks = { workspace = true }
sp-core = { workspace = true }
sp-io = { workspace = true }

# Native / test backends: the SAME crates the RVM intrinsic bodies use
# (single-source-of-truth requirement, docs/RVM-VERIFY-INTRINSICS.md §6).
# Gated off the polkavm target — guest code uses the intrinsics, period.
[target.'cfg(not(target_env = "polkavm"))'.dependencies]
fips204 = { workspace = true, features = ["ml-dsa-65"] }
k256 = { workspace = true, features = ["ecdsa", "arithmetic"] }
p256 = { workspace = true, features = ["arithmetic"] }
p521 = { workspace = true, features = ["ecdsa", "arithmetic"] }
slh-dsa = { workspace = true }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = { workspace = true }

[dev-dependencies]
# Plain + ext curve crates used directly by the differential battery
# (hooked-vs-plain comparisons and the CurveHooks type-level assertion).
ark-bls12-381-ext = { workspace = true, features = ["std"] }
ark-ed-on-bls12-381-bandersnatch = { workspace = true, features = ["std"] }
ark-ed-on-bls12-381-bandersnatch-ext = { workspace = true, features = ["std"] }
# The W3 byte-equality gate (tests/ring_equality.rs): vendored (hooked)
# ark-vrf vs plain upstream. Upstream reference is 0.1.0 — cargo cannot
# hold two same-version sources of one package; 0.1.0 -> 0.1.1 is
# docs/formatting only (verified at vendoring time).
ark-vrf = { workspace = true, default-features = true, features = ["bandersnatch", "ring"] }
ark-vrf-upstream = { package = "ark-vrf", version = "=0.1.0", default-features = true, features = ["bandersnatch", "ring"] }
fips204 = { workspace = true, features = ["ml-dsa-65", "default-rng"] }
p521 = { workspace = true, features = ["ecdsa", "arithmetic", "getrandom"] }

[features]
default = ["std"]
std = [
	"ark-bls12-381/std",
	"ark-ec/std",
	"ark-ff/std",
	"ark-serialize/std",
	"ark-std/std",
	"rostro-curve-hooks/std",
	"k256/std",
	"p256/std",
	"p521/std",
	"sp-core/std",
	"sp-io/std",
]

# SPDX-License-Identifier: Apache-2.0
# Correctness fixture for rostro-guest-crypto: proves the facade's guest
# (ecalli) backend equals its native backend, per entry, inside the real RVM
# interpreter. The perf leg (intrinsic-speed ratios) is the separate
# facade bench planned in docs/RVM-VERIFY-INTRINSICS.md W4.

[package]
name = "rostro-executor-fixture-facade-test"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
build = "build.rs"
publish = false
homepage.workspace = true
repository.workspace = true
description = "PVM correctness fixture: every rostro-guest-crypto facade entry executed in-guest against natively computed expected values."

[lints]
workspace = true

[dependencies]
rostro-guest-crypto = { workspace = true }
sp-io = { workspace = true }
ark-bls12-381 = { workspace = true, features = ["curve"] }
ark-ed-on-bls12-381-bandersnatch = { workspace = true }
ark-ec = { workspace = true }
ark-serialize = { workspace = true }

[target.'cfg(target_env = "polkavm")'.dependencies]
polkavm-derive = { workspace = true }

[build-dependencies]
substrate-wasm-builder = { optional = true, workspace = true, default-features = true }

[features]
default = ["std"]
std = [
	"rostro-guest-crypto/std",
	"sp-io/std",
	"ark-bls12-381/std",
	"ark-ed-on-bls12-381-bandersnatch/std",
	"ark-ec/std",
	"ark-serialize/std",
	"substrate-wasm-builder",
]

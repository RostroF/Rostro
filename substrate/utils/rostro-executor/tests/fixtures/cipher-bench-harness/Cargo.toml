# SPDX-License-Identifier: Apache-2.0
# BENCH-ONLY CRATE — see ../cipher-bench/Cargo.toml. Never shipped.

[package]
name = "rostro-cipher-rvm-bench"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
homepage.workspace = true
repository.workspace = true
description = "Host harness for the multi-cipher RVM benchmark: loads the cipher-bench PVM fixture into the RVM interpreter with the executor's exact configuration and times each cipher's soft/intrinsic variants against native."

[lints]
workspace = true

[[bin]]
name = "cipher-rvm-bench"
path = "src/main.rs"

[dependencies]
polkavm = { workspace = true, default-features = false, features = ["std"] }
rostro-executor = { workspace = true, default-features = true }
rostro-executor-fixture-cipher-bench = { path = "../cipher-bench", default-features = true }
sp-io = { workspace = true, default-features = true }
sp-externalities = { workspace = true, default-features = true }
sp-state-machine = { workspace = true, default-features = true }
sha2 = { workspace = true, features = ["std"] }
ed25519-zebra = { workspace = true, features = ["std"] }
schnorrkel = { workspace = true, features = ["std", "getrandom", "preaudit_deprecated"] }
k256 = { workspace = true, features = ["std", "ecdsa", "arithmetic"] }
slh-dsa = { workspace = true }
ark-bls12-381 = { workspace = true, features = ["std", "curve"] }
ark-ec = { workspace = true, features = ["std"] }
ark-ff = { workspace = true, features = ["std"] }
ark-serialize = { workspace = true, features = ["std"] }
p521 = { version = "0.13", default-features = false, features = ["std", "ecdsa", "arithmetic", "sha512"] }
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65", "default-rng"] }

# SPDX-License-Identifier: Apache-2.0
# Host harness for the facade-test fixture — see ../facade-test/Cargo.toml.

[package]
name = "rostro-facade-rvm-test"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false
homepage.workspace = true
repository.workspace = true
description = "Host harness for the rostro-guest-crypto correctness fixture: computes expected values through the facade's native backend and asserts the in-guest (ecalli) backend reproduces them byte-for-byte."

[lints]
workspace = true

[lib]
name = "rostro_facade_rvm_test"
path = "src/lib.rs"

[[bin]]
name = "facade-rvm-test"
path = "src/main.rs"

[[bin]]
name = "facade-rvm-bench"
path = "src/bench.rs"

[dependencies]
polkavm = { workspace = true, default-features = false, features = ["std"] }
rostro-executor = { workspace = true, default-features = true }
rostro-executor-fixture-facade-test = { path = "../facade-test", default-features = true }
rostro-guest-crypto = { workspace = true, default-features = true }
sp-core = { workspace = true, default-features = true }
sp-io = { workspace = true, default-features = true }
sp-externalities = { workspace = true, default-features = true }
sp-state-machine = { workspace = true, default-features = true }
ark-bls12-381 = { workspace = true, features = ["std", "curve"] }
ark-ed-on-bls12-381-bandersnatch = { workspace = true, features = ["std"] }
ark-ec = { workspace = true, features = ["std"] }
ark-serialize = { workspace = true, features = ["std"] }
k256 = { workspace = true, features = ["std", "ecdsa", "arithmetic"] }
slh-dsa = { workspace = true }
p521 = { workspace = true, features = ["std", "ecdsa", "arithmetic", "getrandom"] }
fips204 = { workspace = true, features = ["ml-dsa-65", "default-rng"] }

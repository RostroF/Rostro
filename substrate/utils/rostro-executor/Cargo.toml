[package]
name = "rostro-executor"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "PVM runtime executor for Rostro. Apache-2.0 replacement for the GPL-3.0 rc-executor-polkavm. Implements the substrate runtime executor surface against the vendored rostrovm fork (polkavm 0.32 + Tier 2 intrinsics) so a runtime cross-compiled to PVM can be loaded, executed, and have its host calls routed through the same sp-io surface a WASM runtime uses. Phase Star deliverable: WASM is retired from the runtime path once this crate is wired in and proven on the testbed."
publish = false

[lints]
workspace = true

[features]
default = ["std"]
std = ["polkavm/std", "sp-wasm-interface/std"]

[dependencies]
# Vendored rostrovm fork (polkavm 0.32 + Tier 2 intrinsics + audit
# hardening). `generic-sandbox` is required for the JIT path on Linux
# x86_64 and is a no-op on the interpreter — matches how rostro-vm-bench
# pulls the fork.
polkavm = { workspace = true, default-features = false, features = ["std", "generic-sandbox"] }
thiserror = { workspace = true }
sp-weights = { workspace = true, default-features = true }
# Function / FunctionContext / HostFunctions / Value / ValueType /
# Pointer types — the substrate ABI surface we bridge to PVM.
sp-wasm-interface = { workspace = true, default-features = false, features = ["std"] }
# B6: CodeExecutor + ReadRuntimeVersion traits live in sp-core::traits;
# Externalities + set_and_run_with_externalities live in sp-externalities.
sp-core = { workspace = true, default-features = true }
sp-externalities = { workspace = true, default-features = true }
# B7: RuntimeVersionOf trait + error::Result type (required by the
# `rc_service::new_full_parts` bound) live in rc-executor. sp-version +
# codec are needed to SCALE-decode the Core_version return into a typed
# RuntimeVersion.
rc-executor = { workspace = true, default-features = true }
sp-version = { workspace = true, default-features = true }
codec = { workspace = true, default-features = true }
log = { workspace = true, default-features = true }

[dev-dependencies]
# sp-io's storage::HostFunctions is what we test the dispatcher against.
sp-io = { workspace = true, default-features = true }
sp-state-machine = { workspace = true, default-features = true }
# PVM-compiled guest fixture for the B3 gate.
rostro-executor-fixture-storage-roundtrip = { workspace = true, default-features = true }
# B5 gate: confirm the real rostro-runtime blob loads against the executor.
# This dev-dep builds rostro-runtime as either WASM or PVM depending on
# `SUBSTRATE_RUNTIME_TARGET`; the B5 test is `#[ignore]`-gated so the
# default `cargo test` run on a WASM-built workspace doesn't trip on it.
rostro-runtime = { workspace = true, default-features = true }

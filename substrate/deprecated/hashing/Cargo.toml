[package]
name = "rp-core-hashing"
version = "16.0.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Hashing primitives (deprecated: use rp-crypto-hashing for new applications)"
documentation = "https://docs.rs/rp-crypto-hashing"

[badges]
maintenance = { status = "deprecated" }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
rp-crypto-hashing = { default-features = true, workspace = true }

[features]
default = ["std"]
std = ["rp-crypto-hashing/std"]

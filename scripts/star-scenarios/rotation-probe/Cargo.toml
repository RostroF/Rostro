# SPDX-License-Identifier: Apache-2.0
# Standalone (non-workspace) star-scenario driver for the consensus-key
# lifecycle proofs (docs/CONSENSUS-KEY-LIFECYCLE.md, workstream 1 P3):
# GRANDPA key rotation via account-signed set_keys (+ keystore insert +
# proof-of-possession), retired-key canary submission, lineage/session state
# reads, and event-wait assertions. Pinned to the same subxt line as the
# lab's extrinsic-probe so the wire types are known-good against gemini.

[package]
name = "rotation-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "1"
codec = { package = "parity-scale-codec", version = "3", features = ["derive"] }
ed25519-dalek = "2"
rostro-hybrid-sig = { path = "../../../substrate/utils/rostro-hybrid-sig" }
sp-core = { path = "../../../substrate/primitives/core", default-features = false, features = ["std", "bandersnatch-experimental"] }
hex = "0.4"
serde_json = "1"
subxt = "0.44"
subxt-rpcs = "0.44"
subxt-signer = { version = "0.44", features = ["subxt", "sr25519"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
opt-level = 1
